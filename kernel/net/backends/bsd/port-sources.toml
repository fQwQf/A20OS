# A20OS owns source selection; upstream remains an unmodified submodule.
# This list is a dependency probe, not the runnable backend build manifest.
# Select the amd64 checksum implementation once (matching upstream VPATH).
sources = [
    "freebsd/amd64/amd64/in_cksum.c",
    "freebsd/netinet/ip_input.c",
    "freebsd/netinet/ip_output.c",
    "freebsd/netinet/tcp_input.c",
    "freebsd/netinet/tcp_output.c",
    "freebsd/netinet/udp_usrreq.c",
    "freebsd/netinet6/ip6_input.c",
    "freebsd/netinet6/ip6_output.c",
    "freebsd/kern/uipc_mbuf.c",
    "freebsd/kern/kern_tc.c",
    "freebsd/vm/uma_core.c",
    "lib/ff_glue.c",
    "lib/ff_init_main.c",
    "lib/ff_freebsd_init.c",
    "lib/ff_lock.c",
    "lib/ff_kern_timeout.c",
    "lib/ff_subr_epoch.c",
    "freebsd/kern/uipc_mbuf2.c",
    "freebsd/kern/uipc_domain.c",
    "freebsd/kern/uipc_sockbuf.c",
    "freebsd/kern/uipc_socket.c",
    "freebsd/net/if.c",
    "freebsd/net/if_clone.c",
    "freebsd/net/if_ethersubr.c",
    "freebsd/net/if_llatbl.c",
    "freebsd/net/ifq.c",
    "freebsd/net/netisr.c",
    "freebsd/net/pfil.c",
    "freebsd/net/radix.c",
    "freebsd/net/route.c",
    "freebsd/net/route/route_ctl.c",
    "freebsd/net/route/route_rtentry.c",
    "freebsd/net/route/route_tables.c",
    "freebsd/net/route/route_helpers.c",
    "freebsd/net/route/route_ifaddrs.c",
    "freebsd/net/route/route_temporal.c",
    "freebsd/net/route/nhop_utils.c",
    "freebsd/net/route/nhop.c",
    "freebsd/net/route/nhop_ctl.c",
    "freebsd/net/rtsock.c",
    "freebsd/net/vnet.c",
    "freebsd/netinet/in.c",
    "freebsd/netinet/in_pcb.c",
    "freebsd/netinet/tcp_reass.c",
    "freebsd/netinet/tcp_sack.c",
    "freebsd/netinet/tcp_subr.c",
    "freebsd/netinet/tcp_syncache.c",
    "freebsd/netinet/tcp_timer.c",
    "freebsd/netinet/tcp_timewait.c",
    "freebsd/netinet/tcp_usrreq.c",
    "freebsd/netinet/ip_icmp.c",
]

# Compiled against A20OS headers, not BSD internal kernel headers.
port_sources = ["kernel/net/backends/bsd/runtime/clock.c"]
