# Independent FreeBSD-derived networking project, not the complete OS source.
repository = "https://github.com/F-Stack/f-stack.git"
path = "kernel/external/f-stack"
revision = "761639943bdda33103aa98241ca6a3079f1c1b7e"
status = "port-in-progress-not-runnable"
# Upstream's Linux/DPDK host substrate is not A20OS's kernel runtime.
host_substrate = "replace-required"
device_substrate = "replace-dpdk-with-a20-packet-io"

# Bootstrap against a release without the FreeBSD-14 link-only stub batch.
release = "v1.25"
freebsd_major = 13
