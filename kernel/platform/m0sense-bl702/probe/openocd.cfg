# BL702 debug TAP as published by BouffaloSDK tools/openocd/target/tgt_702.cfg.
# Supply an adapter configuration separately, and verify board JTAG pinmux.
transport select jtag
adapter speed 1000
jtag newtap bl702 cpu -irlen 5 -expected-id 0x20000e05
target create bl702.cpu riscv -chain-position bl702.cpu
# load_image/verify_image need no algorithm workspace; avoid the data-TCM alias.
riscv set_command_timeout_sec 10
reset_config none
