# ALSA default routing for A20OS.
#
# The kernel exposes one PCM (A20OS Audio / a20pcm) as card 0 with separate
# playback and capture nodes.  Without this file ALSA's built-in "default"
# resolves to the plugin chain in /usr/share/alsa/alsa.conf, which tries
# PulseAudio first; no sound server runs in the XFCE session, so every open
# fails with "PulseAudio: Unable to connect: Connection refused" and
# applications see no usable device.

pcm.!default {
    type hw
    card 0
    device 0
}

ctl.!default {
    type hw
    card 0
}
