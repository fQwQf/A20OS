# OpenAL Soft configuration for A20OS.
#
# The library is built with these backends:
#
#     pulse, alsa, oss, port, jack, null, wave
#
# and it dlopens the ones it needs.  On this system the search ends with no device
# at all: PulseAudio is not running, so the pulse backend fails to initialise, and
# the alsa backend initialises but cannot open ALSA's "default" device, after which
# OpenAL Soft stops looking.  Applications then report "Failed to open OpenAL
# device" and disable their audio (Minecraft does exactly that).
#
# Selecting the null backend gives them a real device -- the "No Output" one -- so
# audio subsystems initialise and stay silent instead of failing.
#
# Change to "alsa" once the kernel PCM opens through ALSA (see
# docs/distro/minecraft-components.md for the state of that).
drivers = null
