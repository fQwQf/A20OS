# OpenAL Soft configuration for A20OS.
#
# The library is built with these backends:
#
#     pulse, alsa, oss, port, jack, null, wave
#
# No sound server runs in the XFCE session, so the pulse backend cannot
# connect and the ALSA backend is the real device path: it opens
# /dev/snd/pcmC0D0p through ALSA's "default" (etc/asound.conf routes that to
# hw:0).  The null backend ("No Output") is only a last resort and is not
# selected here, so a broken device shows up as an OpenAL failure instead of
# silently discarding audio.
drivers = alsa
