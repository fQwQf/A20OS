# mpv defaults for the A20OS XFCE session.
#
# The built-in Lua scripts (osc/ytdl_hook) used to crash intermittently on
# A20OS because of a kernel-side anonymous-memory corruption; that cause is
# fixed and gated by smoke-mtcorrupt, so mpv keeps its normal script set.

# There is no OpenGL in the guest yet (docs/zh/graphics/3d-graphics.md), so the
# default gpu vo cannot initialise; render through XWayland's software path.
vo=x11
hwdec=no
