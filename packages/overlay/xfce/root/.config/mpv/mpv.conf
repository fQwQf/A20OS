# mpv defaults for the A20OS XFCE session.
#
# mpv runs each built-in Lua script (osc/stats/ytdl_hook) in its own thread, and
# on A20OS those threads crash intermittently with a SIGSEGV inside
# libluajit-5.1.so.2 (a GC list head comes back NULL).  Single-threaded LuaJIT
# is fine -- see docs/distro/known-issues.md -- so keep mpv off the Lua path
# until the underlying per-thread state bug is fixed.
#
# Only list options this mpv actually defines.  An unknown option (this build
# has no "stats") makes mpv print a config error, and the built-in scripts then
# stay enabled -- which is exactly what put "lua/stats" on the crashing thread.
load-scripts=no
osc=no
ytdl=no

# There is no OpenGL in the guest yet (docs/graphics/3d-graphics.md), so the
# default gpu vo cannot initialise; render through XWayland's software path.
vo=x11
hwdec=no
