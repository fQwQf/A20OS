# a20-base — A20OS 基础用户态包
#
# 内容对齐旧 mcopy 时代的 FAT32 根文件系统：全部用户态程序平铺在 /，
# init、busybox 和 sh 在根上，通用命令通过小型脚本调用 BusyBox。详见 docs/zh/packaging/packages.md。
#
# 构建前提：`make ARCH=<arch> dev-build`（或任何产出 user/build/<variant> 的目标）。

[package]
name = "a20-base"
version = "0.2.0"
release = 0
description = "A20OS base userland: init, shell, core commands and native services"
url = "https://github.com/fQwQf/A20OS"
license = "Apache-2.0 AND GPL-2.0-only AND MIT"
maintainer = "A20OS developers"
archs = ["riscv64", "aarch64", "x86_64", "loongarch64", "riscv32", "arm32", "ppc64le"]
# 虚拟包：任何实现了"根文件系统里有可用用户态"这一点的包都 provide 它。
# a20-drivers 依赖 a20-userland 而不是 a20-base，这样 min/base 两种
# 用户态都能满足它——之前硬依赖 a20-base 会把 a20-min 顶回冲突。
provides = ["a20-userland"]

# 用户态二进制（init、sh、coreutils 风格命令、native 服务、测试程序）。
# 排除驱动包（归 a20-drivers）和编译中间产物；sh 是实际 ELF，供 FAT 使用。
[[files]]
src = "{build_dir}/*"
dest = "/"
exclude = ["*.o", "*.a", "*.so", "*.d", "*.a20drv", ".build-id", "bash"]

# musl 动态库：用户态动态链接程序需要，沿用旧镜像的 /musl/lib 布局。
[[files]]
src = "{repo}/user/external/musl/build-{variant}/lib/libc.so"
dest = "/musl/lib/libc.so"
mode = "0755"
optional = true

# 网络协议表（与 Makefile PROTOCOLS_LINES 一致）。
[[files]]
dest = "/etc/protocols"
mode = "0644"
content = """
hopopt 0 HOPOPT
icmp 1 ICMP
igmp 2 IGMP
tcp 6 TCP
udp 17 UDP
ipv6 41 IPv6
ipv6-route 43 IPv6-Route
ipv6-frag 44 IPv6-Frag
esp 50 ESP
ah 51 AH
ipv6-icmp 58 IPv6-ICMP
ipv6-nonxt 59 IPv6-NoNxt
ipv6-opts 60 IPv6-Opts
"""

[[files]]
dest = "/etc/os-release"
mode = "0644"
content = """
ID=A20OS
NAME="A20OS"
PRETTY_NAME="A20OS"
VERSION="{version}"
VERSION_ID="{version}"
"""

# 文件系统冒烟测试的标记文件（旧镜像同样携带）。
[[files]]
dest = "/test.txt"
mode = "0644"
content = "Hello from A20OS!\n"
