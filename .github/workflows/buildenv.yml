# 构建环境镜像：tools/ci/Dockerfile 变更时重建并推送到 ghcr.io。
# 首次启用需手动跑一次（Actions 页面 → buildenv → Run workflow），
# 或在本地 `docker build -t ghcr.io/<owner小写>/a20os-buildenv:latest tools/ci && docker push`。
# 详见 docs/packaging/ci.md
#
# 注意：ghcr 镜像名必须全小写（owner 如 fQwQf 含大写时，buildx 会直接
# 拒绝 "repository name must be lowercase"），推 push 前先小写化 owner。
name: buildenv

on:
  push:
    branches: [main]
    paths: [tools/ci/**, .github/workflows/buildenv.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve lowercase image repo (ghcr requires lowercase)
        run: echo "IMAGE_REPO=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/a20os-buildenv" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: tools/ci
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:latest
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
