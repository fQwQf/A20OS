name: buildenv

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build environment to publish
        type: choice
        default: multi
        options: [multi, base, riscv, aarch64, x86_64, loongarch64, arm32, armv7m]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build-${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # ghcr 镜像名必须全小写（owner 如 fQwQf 含大写时 buildx 会直接拒绝
      # "repository name must be lowercase"）。
      - name: Resolve lowercase image repo and tag
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_REPO=ghcr.io/$owner/a20os-buildenv" >> "$GITHUB_ENV"
          if [ "${{ inputs.target }}" = multi ]; then
            # multi 是全集，发布为 :latest；:sha 保留回滚到某次构建的能力。
            echo "TAG=latest" >> "$GITHUB_ENV"
          else
            echo "TAG=${{ inputs.target }}" >> "$GITHUB_ENV"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: tools/ci
          target: ${{ inputs.target }}
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.TAG }}
            ${{ env.IMAGE_REPO }}:${{ env.TAG }}-${{ github.sha }}
          cache-from: type=gha,scope=buildenv-${{ inputs.target }}
          cache-to: type=gha,mode=max,scope=buildenv-${{ inputs.target }}

      # 自检必须在 pull 回来的镜像上跑。构建缓存、多阶段 target 与推送环节都
      # 可能改变最终内容，本地 build 通过不等于发布出去的那个能编。
      - name: Self-test the published image
        run: |
          docker pull "$IMAGE_REPO:$TAG"
          docker run --rm -v "$PWD:/src" -w /src "$IMAGE_REPO:$TAG" \
            sh tools/ci/image-selftest.sh "${{ inputs.target }}"
