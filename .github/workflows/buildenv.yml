# 构建环境镜像：tools/ci/Dockerfile 变更时重建并推送到 ghcr.io。
# 首次启用需手动跑一次（Actions 页面 → buildenv → Run workflow），
# 或在本地 `docker build -t ghcr.io/<owner>/a20os-buildenv:latest tools/ci && docker push`。
# 详见 docs/packaging/ci.md
name: buildenv

on:
  push:
    branches: [main]
    paths: [tools/ci/**, .github/workflows/buildenv.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: tools/ci
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/a20os-buildenv:latest
            ghcr.io/${{ github.repository_owner }}/a20os-buildenv:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
