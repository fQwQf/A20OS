name: Native ABI gates

on:
  workflow_call:
    inputs:
      buildenv-image:
        required: true
        type: string
      extended:
        type: boolean
        default: false

jobs:
  native:
    name: native-${{ matrix.arch }}
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.buildenv-image }}
    timeout-minutes: 60
    env:
      LC_ALL: C
      BSD_CLANG: clang-19
    strategy:
      fail-fast: false
      matrix:
        arch: [riscv64, aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/build-setup
      - name: ccache
        uses: actions/cache@v4
        with:
          path: build/cache/ccache
          key: ccache-native-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: ccache-native-${{ matrix.arch }}-
      - name: Build Native programs for the target architecture
        run: make ARCH=${{ matrix.arch }} ABI=both native-programs
        env:
          CCACHE_DIR: ${{ github.workspace }}/build/cache/ccache
      - name: Run shared Native assertions
        # The core tier shares four contracts across both architectures.
        # Extended includes the full suite and reports hardware exclusions.
        run: |
          if [ "${{ inputs.extended }}" = true ]; then
            make ARCH=${{ matrix.arch }} smoke-native-suite
          else
            make ARCH=${{ matrix.arch }} smoke-native-contract smoke-native-deepen smoke-native-mm smoke-native-ipc
          fi
        env:
          CCACHE_DIR: ${{ github.workspace }}/build/cache/ccache
      - name: AArch64 Linux ABI pressure
        if: matrix.arch == 'aarch64' && inputs.extended
        run: |
          make smoke-pty-stress-aarch64
          make smoke-timeout-test-aarch64
          make smoke-futex-stress-aarch64-smp4
          make smoke-swap-aarch64
          make smoke-swap-aarch64-smp4
        env:
          CCACHE_DIR: ${{ github.workspace }}/build/cache/ccache
      - name: Upload Native smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-smoke-${{ matrix.arch }}-logs
          path: .kernel-build/smoke/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
