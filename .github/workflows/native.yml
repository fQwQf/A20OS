name: Native ABI gates

on:
  workflow_call:
    inputs:
      buildenv-image:
        required: true
        type: string

jobs:
  native:
    name: native-${{ matrix.arch }}
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.buildenv-image }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [riscv64, aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Trust workspace ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: ccache
        uses: actions/cache@v4
        with:
          path: build/cache/ccache
          key: ccache-native-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: ccache-native-${{ matrix.arch }}-
      - name: Build Native programs for the target architecture
        run: make ARCH=${{ matrix.arch }} ABI=both native-programs
        env:
          CCACHE_DIR: ${{ github.workspace }}/build/cache/ccache
      - name: Run shared Native assertions
        # Hardware-private RTC/UBD cases run on RISC-V only; the runner prints
        # each platform exclusion. Every other case shares one assertion table.
        run: make ARCH=${{ matrix.arch }} smoke-native-suite
        env:
          CCACHE_DIR: ${{ github.workspace }}/build/cache/ccache
      - name: AArch64 PTY, timeout and SMP futex pressure
        if: matrix.arch == 'aarch64'
        run: |
          make smoke-pty-stress-aarch64
          make smoke-timeout-test-aarch64
          make smoke-futex-stress-aarch64-smp4
        env:
          CCACHE_DIR: ${{ github.workspace }}/build/cache/ccache
      - name: Upload Native smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-smoke-${{ matrix.arch }}-logs
          path: .kernel-build/smoke/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
