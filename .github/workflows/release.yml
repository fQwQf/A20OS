# 发布流水线：tag v* 触发。构建全架构镜像与包仓库，签名后发 GitHub Release。
#
# 一次性准备（仓库管理员）：
#   Settings → Secrets → Actions → 新建 A20_REPO_SIGNING_KEY，
#   内容为发布私钥 PEM（openssl genrsa 4096 生成；公钥随包仓库发布，见下）。
#   未配置 secret 时流程仍可运行，但产物不签名并打印警告。
#
# TODO(publishing): 包仓库暂未发布到 Pages——原先的部署既与 pages.yml 抢同一个
#   站点，又把 build/repo 拷进 site/ 源目录且从不执行 site/build.sh；见 docs/packaging/repository.md。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 同 ci.yml：ghcr 镜像名必须全小写，owner 含大写时先算好小写镜像名。
  buildenv-image:
    name: resolve-buildenv-image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - id: resolve
        run: echo "image=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/a20os-buildenv:latest" >> "$GITHUB_OUTPUT"

  build:
    name: release-${{ matrix.arch }}
    needs: buildenv-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.buildenv-image.outputs.image }}
      options: --privileged
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [riscv64, x86_64, aarch64, loongarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Alpine world composition (devel) runs target-arch maintainer scripts;
      # qemu-user + binfmt lets them execute on the x86_64 runner.
      - name: Register foreign-arch binfmt (qemu-user)
        run: |
          set -e
          if ! ls /usr/lib/binfmt.d/qemu-*.conf >/dev/null 2>&1; then
            apt-get update && apt-get install -y --no-install-recommends qemu-user-static
          fi
          mkdir -p /mnt/binfmt_misc
          mountpoint -q /mnt/binfmt_misc || mount -t binfmt_misc binfmt_misc /mnt/binfmt_misc
          for f in /usr/lib/binfmt.d/qemu-*.conf; do
            [ -e "$f" ] || continue
            name="$(basename "$f" .conf)"
            [ -e "/mnt/binfmt_misc/$name" ] && continue
            cat "$f" > /mnt/binfmt_misc/register
          done
          ls /mnt/binfmt_misc/

      - name: Trust workspace ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install release signing key
        run: |
          mkdir -p build/keys
          if [ -n "${A20_REPO_SIGNING_KEY:-}" ]; then
            printf '%s\n' "$A20_REPO_SIGNING_KEY" > build/keys/a20os-release.rsa
            openssl rsa -in build/keys/a20os-release.rsa -pubout \
              -out build/keys/a20os-release.rsa.pub 2>/dev/null
            echo "PKG_SIGN_KEY=build/keys/a20os-release.rsa" >> "$GITHUB_ENV"
            echo "PKG_KEY_NAME=a20os-release.rsa.pub" >> "$GITHUB_ENV"
          else
            echo "::warning::A20_REPO_SIGNING_KEY not set; packages and index will be UNSIGNED"
            echo "PKG_SIGN_KEY=" >> "$GITHUB_ENV"
          fi
        env:
          A20_REPO_SIGNING_KEY: ${{ secrets.A20_REPO_SIGNING_KEY }}

      - name: ccache
        uses: actions/cache@v4
        with:
          path: build/cache/ccache
          key: ccache-release-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: ccache-release-${{ matrix.arch }}-

      - name: Build kernel + userland
        run: make ARCH=${{ matrix.arch }} dev-build
        env:
          CCACHE_DIR: ${{ github.workspace }}/build/cache/ccache

      - name: Package, index, sign
        run: make ARCH=${{ matrix.arch }} pkg-repo

      - name: Compose images (base + devel)
        run: |
          make ARCH=${{ matrix.arch }} image-world PKG_WORLD=base PKG_ALPINE=0
          make ARCH=${{ matrix.arch }} image-world PKG_WORLD=devel PKG_SIZE_MB=1024

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            build/images/
            build/repo/${{ matrix.arch }}/
            build/keys/*.rsa.pub
          if-no-files-found: error

  # 只创建 GitHub Release。刻意不挂 github-pages environment：该 environment
  # 只允许 main 分支，而带 environment 的 job 会在任何 step 之前被拒绝，
  # 于是 tag 触发的 Release 永远建不出来。
  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      # body_path 与 generate_release_notes 同时给是有意的：action 会把 body
      # 前置到 GitHub 生成的 changelog 之前（见 action.yml 同名输入的说明）。
      - name: Use the annotated tag message as the release body
        run: git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/images/*.img
          body_path: release-notes.md
          generate_release_notes: true
