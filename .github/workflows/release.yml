# Build and package releases; routine source checks belong to CI.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      devel:
        description: Also build the devel world
        type: boolean
        default: false

permissions:
  contents: read

env:
  LC_ALL: C
  BSD_CLANG: clang-19

jobs:
  release-version:
    name: check-release-version
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "image=ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/a20os-buildenv:latest" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - name: Check kernel version and release tag
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python3 tools/release/check-release-version.py "$GITHUB_REF_NAME"
          else
            python3 tools/release/check-release-version.py
          fi

  build:
    name: release-${{ matrix.arch }}
    needs: [release-version]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.release-version.outputs.image }}
      options: --privileged
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [riscv64, x86_64, aarch64, loongarch64]
    steps:
      - uses: actions/checkout@v4
      - name: Initialize build dependencies
        run: git submodule update --init --recursive kernel/external/f-stack kernel/external/lwip-upstream user/external/musl user/external/mlibc user/external/apps/fastfetch user/external/rtw89
      - uses: ./.github/actions/build-setup

      - name: Register foreign-arch binfmt for devel composition
        if: github.ref_type == 'tag' || inputs.devel
        run: |
          set -eu
          if ! ls /usr/lib/binfmt.d/qemu-*.conf >/dev/null 2>&1; then
            apt-get update && apt-get install -y --no-install-recommends qemu-user-static
          fi
          mkdir -p /mnt/binfmt_misc
          mountpoint -q /mnt/binfmt_misc || mount -t binfmt_misc binfmt_misc /mnt/binfmt_misc
          for f in /usr/lib/binfmt.d/qemu-*.conf; do
            [ -e "$f" ] || continue
            name="$(basename "$f" .conf)"
            [ -e "/mnt/binfmt_misc/$name" ] || cat "$f" > /mnt/binfmt_misc/register
          done

      - name: Install release signing key
        env:
          A20_REPO_SIGNING_KEY: ${{ secrets.A20_REPO_SIGNING_KEY }}
          ALLOW_UNSIGNED_RELEASE: ${{ vars.ALLOW_UNSIGNED_RELEASE }}
        run: |
          mkdir -p build/keys
          if [ -n "${A20_REPO_SIGNING_KEY:-}" ]; then
            printf '%s\n' "$A20_REPO_SIGNING_KEY" > build/keys/a20os-release.rsa
            openssl rsa -in build/keys/a20os-release.rsa -pubout \
              -out build/keys/a20os-release.rsa.pub 2>/dev/null
            echo "PKG_SIGN_KEY=build/keys/a20os-release.rsa" >> "$GITHUB_ENV"
            echo "PKG_KEY_NAME=a20os-release.rsa.pub" >> "$GITHUB_ENV"
          elif [ "${ALLOW_UNSIGNED_RELEASE:-}" = "1" ]; then
            echo '::warning::Explicitly authorized unsigned artifacts'
            echo 'PKG_SIGN_KEY=' >> "$GITHUB_ENV"
          else
            echo '::error::A20_REPO_SIGNING_KEY is required; unsigned release requires explicit ALLOW_UNSIGNED_RELEASE=1'
            exit 1
          fi

      - uses: actions/cache@v4
        with:
          path: build/cache/ccache
          key: ccache-release-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-release-${{ matrix.arch }}-
            ccache-kernel-${{ matrix.arch }}-

      - name: Build kernel, userspace and bootstrap FAT
        env:
          CCACHE_DIR: ${{ github.workspace }}/build/cache/ccache
        run: |
          set -eu
          make -j2 ARCH=${{ matrix.arch }} kernel-only check-user-build-stamp
          bdir=$(make -s ARCH=${{ matrix.arch }} print-build-dir)
          make -j2 ARCH=${{ matrix.arch }} "$bdir/fat32.img"
          echo "RELEASE_BUILD_DIR=$bdir" >> "$GITHUB_ENV"

      - name: Package, index, sign and compose the base world
        run: make -j2 ARCH=${{ matrix.arch }} image-world PKG_WORLD=base PKG_ALPINE=0

      - name: Compose the devel world
        if: github.ref_type == 'tag' || inputs.devel
        run: make -j2 ARCH=${{ matrix.arch }} image-world PKG_WORLD=devel PKG_SIZE_MB=1024

      - name: Collect deliverable files
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
          INCLUDE_DEVEL: ${{ github.ref_type == 'tag' || inputs.devel }}
        run: |
          set -eu
          out="build/releases/$RELEASE_ARCH"
          mkdir -p "$out"
          cp "$RELEASE_BUILD_DIR/kernel.elf" "$out/kernel.elf"
          cp "$RELEASE_BUILD_DIR/kernel.bin" "$out/kernel.bin"
          cp "$RELEASE_BUILD_DIR/fat32.img" "$out/bootstrap-$RELEASE_ARCH.img"
          cp "build/images/base-$RELEASE_ARCH.img" "$out/"
          if [ "$INCLUDE_DEVEL" = true ]; then
            cp "build/images/devel-$RELEASE_ARCH.img" "$out/"
          fi
          cp -r "build/repo/$RELEASE_ARCH" "$out/repository"
          for key in build/keys/*.rsa.pub; do
            [ ! -f "$key" ] || cp "$key" "$out/"
          done
          python3 -c 'import json,os,pathlib; p=pathlib.Path("build/releases")/os.environ["RELEASE_ARCH"]; (p/"build-info.json").write_text(json.dumps({"commit":os.environ["GITHUB_SHA"],"arch":os.environ["RELEASE_ARCH"],"profile":"full","abi":"both","devel":os.environ["INCLUDE_DEVEL"]=="true"},indent=2)+"\n")'

      - name: Bundle artifacts and checksums
        run: |
          set -eu
          out="build/releases/${{ matrix.arch }}"
          tar -czf "build/a20os-${{ matrix.arch }}.tar.gz" -C "$out" .
          mv "build/a20os-${{ matrix.arch }}.tar.gz" "$out/"
          (cd "$out" && sha256sum kernel.elf kernel.bin *.img *.tar.gz > SHA256SUMS-${{ matrix.arch }})

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: build/releases/
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish-release
    if: github.ref_type == 'tag'
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Use the annotated tag message as the release body
        run: git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*/*.img
            dist/*/*.tar.gz
            dist/*/SHA256SUMS-*
          body_path: release-notes.md
          generate_release_notes: true
