name: Documentation checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'README*.md'
      - 'docs/**'
      - 'site/**'
      - 'mkdocs.yml'
      - 'Makefile'
      - 'tools/docs/**'
      - 'selftests/test_*doc*.py'
      - '.github/workflows/docs*.yml'
  push:
    branches: [main]
    paths:
      - 'README*.md'
      - 'docs/**'
      - 'site/**'
      - 'mkdocs.yml'
      - 'Makefile'
      - 'tools/docs/**'
      - 'selftests/test_*doc*.py'
      - '.github/workflows/docs*.yml'

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r site/requirements.txt
      - run: python3 -m unittest selftests.test_doc_translator selftests.test_check_doc_citations selftests.test_mkdocs_repo_links selftests.test_docs_layout
      - run: make check-docs
      - run: bash site/build.sh
