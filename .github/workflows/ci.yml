# Keep routine checks small; subsystem and stress tests remain local make targets.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LC_ALL: C
  BSD_CLANG: clang-19
  A20_WAIT_TIMEOUT: "120"
  A20_BUILD_JOBS: "2"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.image.outputs.image }}
      arches: ${{ steps.arches.outputs.arches }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        env:
          OWNER: ${{ github.event.pull_request.base.repo.owner.login || github.repository_owner }}
        run: echo "image=ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/a20os-buildenv:latest" >> "$GITHUB_OUTPUT"
      - id: arches
        run: make -s print-ci-kernel-arches >> "$GITHUB_OUTPUT"

  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install host test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            ripgrep python3-markdown mkdocs mtools dosfstools \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross \
            gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf
      - name: Install pinned Rust
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$version" --profile minimal
      - name: Check manifests and run tool unit tests
        run: make check-manifests check-smoke-cases check-a20-tests

  kernel-build:
    name: kernel-build-${{ matrix.arch }}
    needs: [prepare, checks]
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.prepare.outputs.image }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      max-parallel: 3
      matrix:
        arch: ${{ fromJSON(needs.prepare.outputs.arches) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/build-setup
      - uses: actions/cache@v4
        with:
          path: build/cache/ccache
          key: ccache-kernel-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: ccache-kernel-${{ matrix.arch }}-
      - name: Build kernel
        run: make -j2 ARCH=${{ matrix.arch }} kernel-only
        env:
          CCACHE_DIR: ${{ github.workspace }}/build/cache/ccache

  smoke:
    name: boot-riscv64
    needs: [prepare, checks]
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.prepare.outputs.image }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/build-setup
      - uses: actions/cache@v4
        with:
          path: build/cache/ccache
          key: ccache-smoke-riscv64-${{ github.sha }}
          restore-keys: |
            ccache-smoke-riscv64-
            ccache-kernel-riscv64-
      - name: Boot, execute a program and power off
        run: make -j2 smoke-quickstart
        env:
          CCACHE_DIR: ${{ github.workspace }}/build/cache/ccache
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-riscv64-log
          path: .kernel-build/smoke/smoke-quickstart.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
