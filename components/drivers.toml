# Loadable driver component registry (.a20drv packages).
#
# This file is the single source of truth for which loadable drivers exist,
# which architectures each supports, and which ones are embedded into the
# kernel root ramfs (early DriverStore, owning the boot disk).  `make
# check-component-registry` cross-checks it against the build lists in
# tools/driver-modules.mk; instances select runtime drivers by name through
# [rootfs].drivers (see docs/instances.md).

[[driver]]
name = "rtc"
source = "kernel/drvmod/examples/goldfish_rtc.c"
arches = ["riscv64", "aarch64", "loongarch64"]
early_arches = ["riscv64", "aarch64", "loongarch64"]
description = "Goldfish RTC clock"

[[driver]]
name = "virtio-blk"
source = "kernel/drvmod/examples/virtio_blk.c"
arches = ["riscv64", "x86_64", "aarch64", "loongarch64"]
early_arches = ["riscv64", "x86_64", "aarch64", "loongarch64"]
description = "virtio block device (boot disk candidate)"

