# A20OS 文档站配置（MkDocs Material）
#
# 说明：docs_dir 直接指向仓库根目录的 docs/，文档只有一份，不在网站里复制维护。
# 构建产物输出到 site/_pages/docs/，与手工设计的首页 (site/landing/) 组装后部署到 GitHub Pages。
# 本地构建：pip install mkdocs-material && bash site/build.sh

site_name: A20OS 文档
site_description: A20OS — 高性能、高兼容性的混合内核操作系统
site_author: A20OS contributors
site_url: https://fqwqf.github.io/A20OS/docs/

repo_url: https://github.com/fQwQf/A20OS
repo_name: fQwQf/A20OS
edit_uri: edit/main/docs/

strict: true
validation:
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn

hooks:
  - ../tools/docs/mkdocs_repo_links.py

# 文档源：仓库根目录的 docs/（相对本配置文件解析）
docs_dir: ../docs

# 不纳入文档站的研究性/归档性内容（文件仍保留在仓库中）
exclude_docs: |
  research/
  archive/

theme:
  name: material
  language: zh
  # 自包含：不加载外部字体，使用本地字体栈
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 跟随系统配色
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 切换到暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: lime
      toggle:
        icon: material/weather-night
        name: 切换到亮色模式

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # 中文标题生成可用的锚点 slug
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fQwQf/A20OS
      name: GitHub 仓库

copyright: Copyright &copy; 2026 A20OS contributors · Apache-2.0 License

