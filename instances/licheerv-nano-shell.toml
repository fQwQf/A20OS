name = "licheerv-nano-shell"
description = "licheerv-nano serial BusyBox ash shell in RAM; physical validation pending"
arch = "riscv64"
board = "licheerv-nano"
abi = "linux"

[kernel]
bringup = false
ramfs_user = true
ubsan = false
driver_deployment = "embedded"
swap = false

[machine]
smp = 1

[target]
serial = "/dev/ttyUSB0"
baud = 115200
boot_wait = 0
boot_timeout = "120s"
# BRINGUP without RAMFS_USER checks allocator then shuts down, no shell.
# Wait for init to launch ash; this profile remains interactive.
console_check = ["System ready", "[init] fork=0, calling execve sh"]
boot_media = ["build/licheerv-nano/a20os-licheerv-nano-shell-sdcard.img"]
media_device = "/dev/sdX"

[package]
kind = "board-sdcard"

[handoff]
method = "mmc"
commands = [
    "setenv fdt_addr_r 0x82000000",
    "fatload mmc 0:1 ${loadaddr} kernel.bin",
    "fatload mmc 0:1 ${fdt_addr_r} sg2002-licheerv-nano-b.dtb",
    "fdt addr ${fdt_addr_r}",
    "fdt print /memory@80000000",
    "booti ${loadaddr} - ${fdt_addr_r}",
]
note = """Interactive serial shell profile: RAMFS_USER embeds /bin/init, BusyBox and
basic commands in the kernel; no root disk or network is required. Prepare
firmware using the base board instance, then package this shell instance.
The SD image and kernel are rebuilt with this instance's configuration.
The handoff bundle at build/licheerv-nano/handoff is refreshed by packaging;
do not reuse a bundle from a different instance. The shell stays running.
Filesystem writes are RAM-only and disappear at reset. Ethernet/SSH, video
and audio are separate capabilities, not enabled by this shell profile.
Physical board execution is pending; see docs/zh/platforms/licheerv-nano.md.
"""
