# Serial diagnostics independent of the distro partition and board disk.
name = "huawei-ct5100-recovery"
description = "Huawei CT5100 x64 UEFI RAM recovery shell and media diagnostics"
arch = "x86_64"
board = "x86_64-pc"
abi = "linux"

[kernel]
bringup = false
ramfs_user = true
ramfs_media = true
ubsan = false
swap = false
driver_deployment = "embedded"

[machine]
smp = 1

[package]
kind = "uefi-disk"

[target]
serial = "/dev/ttyUSB0"
baud = 38400
boot_timeout = "180s"
console_check = ["[RAM] usable", "System ready", "[init] fork=0, calling execve sh"]
boot_media = ["build/huawei-ct5100/a20os-recovery.img"]
media_device = "/dev/sdX"
log = ".kernel-build/console/huawei-ct5100-recovery.log"

[net]
stack = "bsd"
