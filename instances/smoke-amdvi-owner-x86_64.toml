name = "smoke-amdvi-owner-x86_64"
description = "Passive AMD-Vi binding, aperture ownership and unbind/rebind; no translation activation"
arch = "x86_64"
abi = "linux"

[machine]
memory = "1G"
smp = 2
extra_qemu = ["-machine", "q35", "-device", "amd-iommu", "-append", "driver.runtime_test=1 driver.amdvi_owner_test=1"]

[test]
expect = ["DRIVER_MEMORY: protected ram_ranges=", "AMDVI: PCI discovery units=1 verified=1 failed=0 driver_enabled=0", "AMDVI_OWNER: bound", "AMDVI_OWNER: PASS claim=1 rebind=1 writes=0", "DRIVER_RESOURCES: PASS claims=1 conflicts=1 owner_refs=1 devres=1 inventory=1 memory=1", "DRIVER_RUNTIME: PASS"]
timeout = "60s"

[net]
stack = "bsd"
