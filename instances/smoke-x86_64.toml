# Bring-up smoke for x86_64: boot the kernel-only image and require the boot
# stages plus a clean self power-off.  Replaces the former handwritten
# smoke-x86_64 recipe in tools/targets-smoke.mk.
name = "smoke-x86_64"
description = "x86_64 kernel bring-up smoke (boot stages + self power-off)"
arch = "x86_64"
abi = "linux"

[kernel]
bringup = true

[test]
expect = ["part ok", "System is going down for power-off NOW"]
