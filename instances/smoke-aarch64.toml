# Bring-up smoke for aarch64: boot the kernel-only image and require the boot
# stages plus a clean self power-off.  Replaces the former handwritten
# smoke-aarch64 recipe in tools/targets-smoke.mk.
name = "smoke-aarch64"
description = "aarch64 kernel bring-up smoke (boot stages + self power-off)"
arch = "aarch64"
abi = "linux"

[kernel]
bringup = true

[test]
expect = ["part ok", "System is going down for power-off NOW"]
