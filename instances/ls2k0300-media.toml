name = "ls2k0300-media"
description = "ls2k0300 retained firmware LCD scanout; no panel modesetting; physical validation pending"
arch = "loongarch64"
board = "ls2k0300"
abi = "linux"

[kernel]
bringup = false
ramfs_user = true
ramfs_media = true
ubsan = false
swap = false
driver_deployment = "embedded"

[package]
kind = "kernel-bundle"

[machine]
smp = 1

[target]
serial = "/dev/serial/by-id/REPLACE_WITH_LS2K0300_UART"
baud = 115200
boot_wait = 3
boot_timeout = "120s"
# Wait for init to launch ash; this profile remains interactive.
console_check = ["System ready", "[init] fork=0, calling execve sh"]

[handoff]
method = "uboot-elf"
prompt_timeout = "60s"
command_timeout = "30s"
commands = ["version", "bdinfo", "printenv", "help bootelf", "help tftpboot"]
note = """RAM shell with existing videoplay and audioplay. retained firmware LCD scanout; no panel modesetting.
Physical execution is pending; see docs/zh/platforms/2k0300.md.
Video/audio devices are exposed only after their hardware probe succeeds.
Files remain in RAM and disappear at reset. No SSH service is provided.
"""
