# Allwinner H616/H618 (Orange Pi Zero 2 / Zero 3 / Zero 2W) bring-up.
#
# The cleanest boot chain in the tree: the SPL is built from U-Boot source and
# BL31 is TF-A's mainline sun50i_h616 platform, so nothing in the chain is a
# vendor blob the build cannot reproduce.  That is the opposite of Rockchip
# (rkbin DDR blob) and Amlogic (signed FIP).
#
# No [package] section: the SD controller is Allwinner's own sunxi-mmc, not a
# DesignWare part, so there is no storage path to put an image on.  See
# docs/platforms/sun50i-h616.md.
name = "sun50i-h616"
description = "Allwinner H616/H618 (Orange Pi Zero 2 / Zero 3 / Zero 2W) aarch64 bring-up, blob-free boot chain"
arch = "aarch64"
board = "sun50i-h616"
abi = "linux"

[kernel]
bringup = true
driver_deployment = "embedded"

[target]
serial = "/dev/ttyUSB0"
baud = 115200
boot_wait = 4
boot_timeout = "120s"
# The Zero 2/Zero 3 route the debug header UART to pins 8/9 (uart0); the
# Zero 2W uses a different header.  Fill in the real device node.
# No [FDT] line on aarch64: only riscv64 and loongarch parse a device tree,
# and the aarch64 port has no DT-based RAM narrowing.  System ready is
# printed by kernel/main.c and is the strongest evidence available here.
console_check = ["System ready"]
commands = ["cat /etc/os-release", "poweroff"]
expect = ["A20OS", "poweroff"]

[package]
# No block driver on this board yet, so there is no medium to write and
# fit-sdcard/grub-iso do not apply.  The artifact is the kernel plus the
# boot-chain commands to load it; `a20 deploy` builds it and prints the
# commands below.
kind = "kernel-bundle"

[handoff]
method = "mmc"
commands = [
    "mmc dev 0",
    "mmc read ${loadaddr} 0x408000 0x8000",
    "booti ${loadaddr} - ${loadaddr}",
]
note = """Unverified: no H616 board has been powered under A20OS, so this sequence is
taken from what mainline U-Boot boots Orange Pi Zero 2 from the TF slot provides, not from a run.  The load address is
deliberately absent here -- `a20 package` reads it out of the ELF and writes it
into uboot.cmd, because a board ldscript may relocate the image.

# The offsets above are the FAT partition start and a generous
# length; both have to be confirmed with `mmc info` on the board.
"""
