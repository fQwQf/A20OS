# VisionFive 2 最小 SD 卡：内核 + FAT32 用户态（含 fastfetch），无 extra 分区。
# 需要先跑一次 make vf2-firmware。镜像编排在 tools/targets-build.mk。
name = "vf2-minimal"
description = "VisionFive 2 minimal bootable SD card"
arch = "riscv64"
board = "visionfive2"
abi = "both"

[kernel]
driver_deployment = "embedded"

[package]
kind = "fit-sdcard"
variant = "minimal"
