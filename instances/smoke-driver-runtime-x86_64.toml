name = "smoke-driver-runtime-x86_64"
description = "Native driver workqueue and fence with real kernel workers and Park/Wake"
arch = "x86_64"
abi = "linux"

[machine]
memory = "1G"
smp = 1
extra_qemu = ["-append", "driver.runtime_test=1"]

[test]
expect = ["DRIVER_RUNTIME: PASS delayed=1 retime=1 cancel=1 requeue=1 destroy_timeout=1 park_wake=1"]
timeout = "60s"

[net]
stack = "bsd"
