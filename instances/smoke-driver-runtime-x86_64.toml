name = "smoke-driver-runtime-x86_64"
description = "Native driver workqueue, fence and firmware with real kernel workers and VFS"
arch = "x86_64"
abi = "linux"

[machine]
memory = "1G"
smp = 1
extra_qemu = ["-append", "driver.runtime_test=1"]

[test]
expect = ["DRIVER_MEMORY: protected ram_ranges=", "DRIVER_RESOURCES: PASS claims=1 conflicts=1 owner_refs=1 devres=1 inventory=1 memory=1", "DRIVER_FENCE_WATCH: PASS notify=1 cancel=1 error=1 work=1", "DRIVER_RUNTIME: PASS delayed=1 retime=1 cancel=1 requeue=1 destroy_timeout=1 park_wake=1 firmware=1"]
timeout = "60s"

[net]
stack = "bsd"
