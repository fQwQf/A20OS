# VisionFive 2 完整 SD 卡：内核 + FAT32 用户态 + 从源码构建的 extra.img
# （vim/git/gcc/...）。需要 make vf2-firmware 与 make vf2-extra-sources。
name = "vf2-extra"
description = "VisionFive 2 full SD card with source-built extra.img"
arch = "riscv64"
board = "visionfive2"
abi = "both"

[kernel]
driver_deployment = "embedded"

[package]
kind = "fit-sdcard"
variant = "extra"
