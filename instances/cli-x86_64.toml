# 纯命令行工作站（apk world 'cli'）。说明见 cli-riscv64.toml。
#
#   tools/a20 run cli-x86_64
name = "cli-x86_64"
description = "Command-line workstation via apk world 'cli' (zsh, GNU coreutils, git/vim/tmux/curl/python3)"
arch = "x86_64"

[machine]
console = "virtio"
memory = "2G"
smp = 2

[rootfs]
world = "cli"
world_size_mb = 1024
