# virgl 3D transport smoke: attach a virgl-capable virtio-gpu and require the
# guest to negotiate VIRTIO_GPU_F_VIRGL and drive a 3D context end to end.
#
# This is the gate that makes "3D is available" a falsifiable claim.  The old
# gpu3d_test returned 0 on a 2D-only device, so it passed everywhere; it now
# exits 77 (SKIP) when the device is 2D-only, which is distinct from PASS.
# Expect SKIP rather than PASS to be a failure here -- it means GPU_3D did not
# reach QEMU, which is exactly the regression this instance exists to catch.
#
# Requires host virgl support.  The display matters as much as the renderer:
# virglrenderer needs the host to give it a desktop GL context, and
# "egl-headless" cannot on a host whose EGL device/gbm platform fails to
# initialise -- QEMU then silently hands the guest a 2D-only device and every
# 3D conclusion is measured against nothing.  A GLX-backed display works,
# because GLX on this host yields a real radeonsi OpenGL 4.6 context.
# "gtk,gl=on" needs an X display; use "gtk" (no GL) only to watch it fail.
name = "smoke-gpu3d-riscv64"
description = "riscv64 virtio-gpu virgl 3D transport smoke (GPU_3D device + gpu3d_test)"
arch = "riscv64"
abi = "linux"

[machine]
gpu_3d = true
display_mode = "gui"

[gui]
display = "gtk,gl=on"

[test]
commands = ["/bin/gpu3d_test", "poweroff"]
# The last two markers are the point of the gate: a command stream the host
# accepted, and the pixels that stream was supposed to produce.  Requiring
# "PASS" alone is what let the placeholder-stream revision of gpu3d_test report
# success while nothing was ever rendered.
expect = [
  "GPU3D_TEST: GETPARAM 3D_FEATURES=1",
  "GPU3D_TEST: GETPARAM capset mask=",
  "GPU3D_TEST: 3D resource",
  "GPU3D_TEST: RESOURCE_INFO round-trip ok",
  "GPU3D_TEST: EXECBUFFER accepted a",
  "GPU3D_TEST: pixel readback ok",
  "GPU3D_TEST: PASS",
]
input_delay = 60
timeout = "240s"
