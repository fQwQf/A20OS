# XFCE 桌面（Wayland/labwc）的 AArch64 版本，经 apk 从 xfce world 安装。
# 细节见 xfce-riscv64.toml 的注释。
#
#   tools/a20 run xfce-aarch64
name = "xfce-aarch64"
description = "XFCE desktop via apk world 'xfce' (labwc, Alpine upstream packages)"
arch = "aarch64"

[machine]
# 4 vCPUs: the two panics this file used to work around (a corrupted trap frame
# after an IPI storm, and a cross-task register dump during SIGSEGV delivery)
# no longer reproduce. sched/proc/futex/mm/scm stress pass under NR_CPUS=4 at
# -smp 4 for 30+ minutes with scheduler violations at 0, and the desktop cold
# boots and renders with all four CPUs online and no panic. See
# docs/status/history/desktop-1.0-2026-10-23.md.
smp = 4
memory = "2G"

[gui]
enabled = true

[rootfs]
world = "xfce"
world_size_mb = 4096
