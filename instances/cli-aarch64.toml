# 纯命令行工作站（apk world 'cli'）。说明见 cli-riscv64.toml。
#
#   tools/a20 run cli-aarch64
name = "cli-aarch64"
description = "Command-line workstation via apk world 'cli' (zsh, GNU coreutils, git/vim/tmux/curl/python3)"
arch = "aarch64"

[machine]
memory = "2G"
# aarch64 SMP is unstable: two distinct kernel races were observed at smp=4
# under desktop load and the tree pins desktop aarch64 to one CPU until they
# are found (docs/status/current/known-issues.md).  That investigation was
# driven by GUI load, not by this world, so keep it single-CPU rather than
# shipping an untested multi-core aarch64 default here.
smp = 1

[rootfs]
world = "cli"
world_size_mb = 1024
