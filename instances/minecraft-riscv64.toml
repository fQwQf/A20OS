# Java Edition desktop on the shared XFCE image. Fetch client files first;
# see docs/zh/distro/minecraft.md. The host display must support virgl/OpenGL.
name = "minecraft-riscv64"
description = "Minecraft Java desktop with host virgl rendering"
arch = "riscv64"
abi = "both"

[machine]
smp = 4
memory = "4G"
gpu_3d = true

[gui]
enabled = true
display = "gtk,gl=on"

[rootfs]
world = "xfce"
world_size_mb = 4096

[net]
stack = "bsd"
