# Bring-up smoke for arm32: boot the kernel-only image and require the boot
# stages plus a clean self power-off.  Replaces the former handwritten
# smoke-arm32 recipe in tools/targets-smoke.mk.
name = "smoke-arm32"
description = "arm32 kernel bring-up smoke (boot stages + self power-off)"
arch = "arm32"
abi = "linux"

[kernel]
bringup = true

[test]
expect = ["part ok", "System is going down for power-off NOW"]
