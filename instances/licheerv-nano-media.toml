name = "licheerv-nano-media"
description = "licheerv-nano onboard DAC PCM and RAM shell; physical validation pending"
arch = "riscv64"
board = "licheerv-nano"
abi = "linux"

[kernel]
bringup = false
ramfs_user = true
ramfs_media = true
ubsan = false
driver_deployment = "embedded"
swap = false

[machine]
smp = 1

[target]
serial = "/dev/ttyUSB0"
baud = 115200
boot_wait = 0
boot_timeout = "120s"
# BRINGUP without RAMFS_USER checks allocator then shuts down, no shell.
# Wait for init to launch ash; this profile remains interactive.
console_check = ["System ready", "[init] fork=0, calling execve sh"]
boot_media = ["build/licheerv-nano/a20os-licheerv-nano-media-sdcard.img"]
media_device = "/dev/sdX"

[package]
kind = "board-sdcard"

[handoff]
method = "mmc"
commands = [
    "setenv fdt_addr_r 0x82000000",
    "fatload mmc 0:1 ${loadaddr} kernel.bin",
    "fatload mmc 0:1 ${fdt_addr_r} sg2002-licheerv-nano-b.dtb",
    "fdt addr ${fdt_addr_r}",
    "fdt print /memory@80000000",
    "booti ${loadaddr} - ${fdt_addr_r}",
]
note = """RAM shell with existing audioplay and videoplay. Onboard SG2002 DAC
PCM requires successful C906 cache-instruction and hardware resource probes.
The board has no initialized DSI scanout in this firmware profile.
Physical execution is pending; see docs/zh/platforms/licheerv-nano.md.
Files remain in RAM and disappear at reset. No SSH service is provided.
"""
