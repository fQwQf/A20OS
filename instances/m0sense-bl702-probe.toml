# An early independent MCU probe, explicitly not the generic RV32 SBI OS.
name = "m0sense-bl702-probe"
description = "M0Sense BL702 M-mode probe: factory USB UF2 upload, LED/UART checks, no full OS"
arch = "riscv32"
board = "m0sense-bl702"

[kernel]
bringup = true
nommu = true
swap = false

[package]
kind = "kernel-bundle"

[target]
serial = "/dev/ttyUSB0"
baud = 115200
boot_wait = 0
boot_timeout = "30s"
console_check = ["A20 BL702 M-mode SRAM probe", "A20 BL702 PROBE READY"]
# Factory UF2 USB upload is implemented by tools/m0sense_deploy_uf2.py.
# USB-only acceptance uses the blue LED heartbeat; UART console is optional.
# The JTAG SRAM loader remains available for boards without the UF2 bootloader.
