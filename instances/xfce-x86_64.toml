# XFCE 桌面的 x86_64 版本（与 riscv64 相同：Wayland/labwc + xfce4 全家桶），
# 经 apk 从共享的 'xfce' world 安装；overlay packages/overlay/xfce 提供
# passwd（root 默认 zsh）与 Wayland 会话脚本。在带 /dev/kvm 的 x86_64
# 宿主机上自动启用 KVM 加速（无 KVM 时回退 TCG）。
#
#   tools/a20 run xfce-x86_64
#     （x86_64 桌面默认已是 BSD；已通过本实例内 curl、真实 Firefox
#       HTTP/HTTPS DOM、动态控制面和 hostfwd TCP/UDP 入站）
name = "xfce-x86_64"
description = "XFCE Wayland/labwc desktop via apk world 'xfce', KVM-accelerated on x86_64"
arch = "x86_64"

[machine]
# smp = 4，与 xfce-riscv64 / xfce-aarch64 一致。
# 此前钉在 smp = 1，称「smp>1 会在会话启动时挂死」。实测不成立：真正的 NR_CPUS=4
# 内核可让本镜像存活 3:29 以上且无 panic。真正的阻塞是帧缓冲 id 复用 GEM handle
# 导致 drmModeSetCrtc 返回 ENOENT（已修，见 09128ad6），与 SMP 无关。
smp = 4
memory = "4G"

[gui]
enabled = true

[rootfs]
world = "xfce"
world_size_mb = 4096

[net]
# Protocol stack selected by this instance (NOT the QEMU netdev spec).
stack = "bsd"
# QEMU user networking publishes the kernel path as the Multiboot cmdline
# when no -append is supplied.  Declare the SLIRP static lease explicitly so
# the BSD backend never starts with an unconfigured link.
guest_ip = "10.0.2.15"
guest_netmask = "255.255.255.0"
guest_gateway = "10.0.2.2"
