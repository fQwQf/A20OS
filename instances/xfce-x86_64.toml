# XFCE 桌面的 x86_64 版本（与 riscv64 相同：Wayland/labwc + xfce4 全家桶），
# 经 apk 从共享的 'xfce' world 安装；overlay packages/overlay/xfce 提供
# passwd（root 默认 zsh）与 Wayland 会话脚本。在带 /dev/kvm 的 x86_64
# 宿主机上自动启用 KVM 加速（无 KVM 时回退 TCG）。
#
#   tools/a20 run xfce-x86_64
name = "xfce-x86_64"
description = "XFCE Wayland/labwc desktop via apk world 'xfce', KVM-accelerated on x86_64"
arch = "x86_64"

[machine]
# smp>1 (CONFIG_SMP build) currently hangs during XFCE session bring-up on
# x86_64 (components block on socket/dbus wakeups); single-core is the
# verified-working configuration until that scheduler bug is fixed.
smp = 1
memory = "2G"

[gui]
enabled = true

[rootfs]
world = "xfce"
world_size_mb = 4096
