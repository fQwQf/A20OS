name = "smoke-driver-protocols-x86_64"
description = "Native primary and extension protocols through a real VirtIO net module"
arch = "x86_64"
abi = "both"

[kernel]
driver_deployment = "generic"

[machine]
memory = "1G"
smp = 2
extra_qemu = ["-device", "virtio-net-pci,netdev=protocolnet", "-netdev", "user,id=protocolnet", "-append", "driver.protocol_test=1"]

[test]
expect = ["DRIVER_PROTOCOLS: PASS primary=1 extension=1 send=1 stats=1"]
timeout = "60s"

[net]
stack = "lwip"
