name = "qemu-riscv32-mcu"
description = "RV32IMC M-mode MCU kernel regression (QEMU virt, not ESP32-C3 emulation)"
arch = "riscv32"
board = "qemu-virt-riscv32-mcu"
abi = "native"
[kernel]
profile = "mcu"
nommu = true
bringup = true
[machine]
smp = 1
memory = "4M"  # kernel window is 320K; QEMU needs the rest for the DTB
[test]
timeout = "15s"
expect = ["[MCU TEST] PASS", "A20OS MCU READY", "[DEMO] experiments 4.1-4.5: PASS"]

[net]
# No TCP/IP in this footprint; cluster transports still use UART.
stack = "none"
