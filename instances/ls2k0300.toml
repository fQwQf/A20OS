# Initial RAM-only profile for 龙芯 2K0300 久久派, NOT hardware-validated.
# docs/platforms/2k0300.md explains the firmware and RAM-map prerequisites.
name = "ls2k0300"
description = "Loongson 2K0300 久久派 LA264 IRQ RAM bring-up; firmware handoff unverified"
arch = "loongarch64"
board = "ls2k0300"
abi = "linux"

[kernel]
bringup = true
driver_deployment = "embedded"

[package]
kind = "kernel-bundle"

[target]
serial = "/dev/serial/by-id/REPLACE_WITH_LS2K0300_UART"
baud = 115200
boot_wait = 3
boot_timeout = "120s"
console_check = ["[LS2K0300] stage=irq", "System ready"]

[handoff]
method = "uboot-elf"
prompt_timeout = "60s"
command_timeout = "30s"
commands = ["version", "bdinfo", "printenv", "help bootelf", "help tftpboot"]
note = "RAM-only ELF bundle at build/ls2k0300/handoff. Firmware version, free DDR and bootelf availability must be established first; commands.txt performs read-only U-Boot inventory and uboot.cmd.in is a commented manual template. Use a20 deploy --auto-handoff --transfer usb|mmc|tftp for the checked host runner: it parses complete DDR/LMB evidence, selects staging outside the kernel allocator and firmware reservations, checks size and CRC32, then bootelf -p. PMON is detected and captures help, but its unverified ELF/memory ABI is refused. See docs/platforms/2k0300.md."
