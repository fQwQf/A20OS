# SG2002 single-hart S-mode bring-up, not a userspace image. No board run yet.
name = "licheerv-nano"
description = "LicheeRV Nano SG2002 256 MiB early bring-up with prepared FAT/FIP SD image"
arch = "riscv64"
board = "licheerv-nano"
abi = "linux"

[kernel]
bringup = true
driver_deployment = "embedded"
swap = false

[target]
serial = "/dev/ttyUSB0"
baud = 115200
boot_wait = 0
boot_timeout = "120s"
# BRINGUP without RAMFS_USER checks allocator then shuts down, no shell.
console_check = ["[FDT] RAM range", "System ready (bringup, no userspace)", "part ok", "System is going down for power-off NOW"]
boot_media = ["build/licheerv-nano/a20os-licheerv-nano-sdcard.img"]
media_device = "/dev/sdX"

[package]
kind = "board-sdcard"

[handoff]
method = "mmc"
commands = [
    "setenv fdt_addr_r 0x82000000",
    "fatload mmc 0:1 ${loadaddr} kernel.bin",
    "fatload mmc 0:1 ${fdt_addr_r} sg2002-licheerv-nano-b.dtb",
    "fdt addr ${fdt_addr_r}",
    "fdt print /memory@80000000",
    "booti ${loadaddr} - ${fdt_addr_r}",
]
note = """Run a20 prepare licheerv-nano once, then package to produce a whole-card MBR/FAT
image with vendor cv181x FSBL, mainline OpenSBI/U-Boot, matching Nano B DTB,
RISC-V Image and size/CRC-checked boot.scr. fip.bin is a FAT file, not raw SPL.
The prepared firmware moves scriptaddr to 0x8e000000 and disables optional
secondary RTOS payload. The card autoboots; the commands above are recovery.
Only SG2002 SD/UART early bring-up is shared with E/WE; no Ethernet promise.
No SG2002 hardware has run this kernel. See docs/platforms/licheerv-nano.md.
"""
