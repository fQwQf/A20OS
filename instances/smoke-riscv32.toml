# Bring-up smoke for riscv32: boot the kernel-only image and require the boot
# stages plus a clean self power-off.  Replaces the former handwritten
# smoke-riscv32 recipe in tools/targets-smoke.mk.
name = "smoke-riscv32"
description = "riscv32 kernel bring-up smoke (boot stages + self power-off)"
arch = "riscv32"
abi = "linux"

[kernel]
bringup = true

[test]
expect = ["part ok", "System is going down for power-off NOW"]
