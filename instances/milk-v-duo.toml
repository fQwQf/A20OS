# Milk-V Duo (SophGo CV1800B) bring-up.
#
# Stage-1 instance, same shape as licheerv-nano: no [package] section, because
# there is no storage driver for the DWCMSH controller yet.  See
# docs/platforms/milk-v-duo.md.
#
# This board has 64 MiB of RAM -- U-Boot reports "DRAM: 63.3 MiB" -- which is
# the whole reason it is the second target rather than the first.  nommu is the
# default here because 64 MiB is the whole budget: the page table structures an
# MMU build spends on a 256 MiB-scale address space come out of the same pool the
# userland lives in.  ramfs_user puts the userland in RAM instead of on a
# filesystem, and swap is off because there is nowhere to put a page.  Do not try
# image-world on this board: a full apk world does not fit in 64 MiB.  If you want
# the same SoC with room to breathe, the LicheeRV Nano is 256 MiB for the same
# money.  See docs/platforms/milk-v-duo.md for why NOMMU is the ceiling here.
name = "milk-v-duo"
description = "Milk-V Duo (CV1800B, 64 MiB) riscv64 NOMMU bring-up, RAMFS userland, no swap"
arch = "riscv64"
board = "milk-v-duo"
abi = "linux"

[kernel]
bringup = true
nommu = true
driver_deployment = "embedded"
ramfs_user = true
swap = false

[target]
serial = "/dev/ttyUSB0"
baud = 115200
boot_wait = 3
boot_timeout = "120s"
# On 64 MiB the RAM window is the first thing to get wrong: a board header that
# claimed more would make the allocator walk off the end of real RAM.  The FDT
# line has to agree with the 64 MiB window in milk_v_duo_platform.h.
console_check = ["[FDT]", "System ready"]
commands = ["cat /etc/os-release", "poweroff"]
expect = ["A20OS", "poweroff"]

[package]
# No block driver on this board yet, so there is no medium to write and
# fit-sdcard/grub-iso do not apply.  The artifact is the kernel plus the
# boot-chain commands to load it; `a20 deploy` builds it and prints the
# commands below.
kind = "kernel-bundle"

[handoff]
method = "tftp"
commands = [
    "tftp ${loadaddr} kernel.bin",
    "booti ${loadaddr} - ${loadaddr}",
]
note = """Unverified: no CV1800B board has been powered under A20OS, so this sequence is
taken from what mainline U-Boot boots this board from the TF slot provides, not from a run.  The load address is
deliberately absent here -- `a20 package` reads it out of the ELF and writes it
into uboot.cmd, because a board ldscript may relocate the image.

# U-Boot needs to know where the host is before tftp works:
#   setenv serverip <host-ip>; setenv ipaddr <board-ip>
"""
