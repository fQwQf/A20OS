pattern = "FUTEX_STRESS: unrelated-wake-isolation PASS"
files = ["user/cmds/stress/futex_stress.c"]

[[gate.assertion]]
pattern = "PROC_STRESS: vfork-auto-reap PASS"
files = ["user/cmds/stress/proc_stress.c"]

