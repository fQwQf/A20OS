# The DRM object store is device-global by design, so two processes drive it at
# once (the wlroots allocator creates buffers on one fd, the backend consumes
# them on another).  These assertions pin the lock that makes that safe, plus the
# split that keeps it out of the VFS and MM paths.  The matching prose is
# docs/drivers/guide/lock-order.md, asserted below so code and contract cannot
# drift apart silently.
[[gate]]
name = "drm-store-locking"
make_target = "check-drm-store-locking"

[[gate.assertion]]
pattern = "g_drm_store\\.lock"
files = ["kernel/drivers/gpu/drm.c"]

[[gate.assertion]]
pattern = "mutex_init\\(&g_drm_store\\.lock\\)"
files = ["kernel/drivers/gpu/drm.c"]

# detach-under-lock / free-after-unlock is the whole point: releasing the VMO and
# the host resource allocates, enters the MM layer and talks to the device, none
# of which may happen with the store lock held.
[[gate.assertion]]
pattern = "drm_gem_detach_locked"
files = ["kernel/drivers/gpu/drm.c"]

[[gate.assertion]]
pattern = "drm_gem_drop_storage"
files = ["kernel/drivers/gpu/drm.c"]

# A pin exists so a long operation can run with the lock dropped without the
# storage being torn down underneath it; every pin needs its matching unpin.
[[gate.assertion]]
pattern = "drm_gem_pin\\("
files = ["kernel/drivers/gpu/drm.c"]

[[gate.assertion]]
pattern = "drm_gem_unpin\\("
files = ["kernel/drivers/gpu/drm.c"]

# The PRIME export walks a pinned GEM's pages with the lock dropped. A snapshot
# of the VMO under the lock without a pin is a use-after-free reachable from any
# fd, so the export must pin rather than merely read.
[[gate.assertion]]
pattern = "drm_gem_pin\\(p\\.handle\\)"
files = ["kernel/drivers/gpu/drm.c"]

# The GEM name table is documented as store-lock protected; the helper that walks
# it has to carry the _locked suffix or the contract is a lie.
[[gate.assertion]]
pattern = "drm_gem_name_lookup_locked"
files = ["kernel/drivers/gpu/drm.c"]

# Counts, not just presence: a plain presence assertion stays green when the
# locking is stripped out of the handlers, because the name still occurs
# elsewhere in the file. Verified by deleting lock/unlock pairs -- these are the
# assertions that go red. The threshold sits well below the real count so an
# ordinary refactor does not trip it.
#
# What this cannot do: catch ONE deleted call site in one handler. A source
# pattern gate has no view of control flow. The thresholds are here to catch
# wholesale removal; per-handler discipline stays the SMP smoke tests' job, and
# lock-order.md carries the rule.
[[gate.assertion]]
pattern = "drm_lock\\(\\);"
min_count = 30
files = ["kernel/drivers/gpu/drm.c"]

[[gate.assertion]]
pattern = "drm_unlock\\(\\);"
min_count = 30
files = ["kernel/drivers/gpu/drm.c"]

# virtio_gpu.c shares one big_req buffer across all four submit paths; filling it
# outside inst->command_lock is a use-after-free, not a style question.
[[gate.assertion]]
pattern = "mutex_lock\\(&inst->command_lock\\)"
files = ["kernel/drivers/gpu/virtio_gpu.c"]

# The buffer cap is what stops one ioctl asking for a multi-gigabyte VMO.
[[gate.assertion]]
pattern = "DRM_MAX_BUFFER_BYTES"
files = ["kernel/drivers/gpu/drm.c", "kernel/include/drivers/gpu/drm_geom.h"]

[[gate.assertion]]
pattern = "drm_dumb_layout"
files = ["kernel/drivers/gpu/drm.c", "tools/tests/drm_geom_test.c"]

# The documented contract, so the code cannot lose its prose.
[[gate.assertion]]
pattern = "g_drm_store\\.lock"
files = ["docs/drivers/guide/lock-order.md"]

[[gate.assertion]]
pattern = "inst->command_lock"
files = ["docs/drivers/guide/lock-order.md"]

[[gate]]
name = "ext4-journal-crash-consistency"
make_target = "smoke-ext4-journal"

# The commit pointer has to move past every data block the transaction logged,
# not past one of them: a commit block written on top of a data block is read
# back as log data, so the next mount silently discards a committed
# transaction.
[[gate.assertion]]
pattern = "jbd2_advance_n\\(j, log, ej->tx_count\\)"
files = ["kernel/fs/diskfs/ext4_journal.c"]

# A descriptor's own checksum covers the tag checksums written after it, so it
# has to be computed last or every committed transaction fails its checksum on
# replay.
[[gate.assertion]]
pattern = "jbd2_metadata_checksum_put\\(j, block\\);"
files = ["kernel/fs/diskfs/ext4_journal.c"]

# The data checksum lives in the descriptor tag.  Writing it into the block's
# last four bytes would replay a journal checksum into a block bitmap's hashed
# tail and desynchronise it from its group descriptor.
[[gate.assertion]]
negate = true
pattern = "jbd2_data_checksum_put"
files = ["kernel/fs/diskfs/ext4_journal.c"]

# Mount-time recovery must not depend on the needs_recovery bit alone: that bit
# shares a cache page with the superblock's free counters, which the open
# transaction holds, so a crash can lose the bit while keeping the log.
[[gate.assertion]]
pattern = "ext4_journal_log_pending\\(esi, &sb\\)"
files = ["kernel/fs/diskfs/ext4.c"]

# The sync hook needs a way back to the filesystem it belongs to; installing one
# without its owner is how ext4's journal commit and FAT32's FSInfo writeback
# both became dead code.
[[gate.assertion]]
pattern = "bcache_set_sync_hook\\(bcache_t \\*bc, int \\(\\*hook\\)\\(bcache_t \\*\\)"
files = ["kernel/include/fs/block_cache.h"]

[[gate.assertion]]
pattern = "bcache_set_sync_hook\\(esi->bc, ext4_journal_sync_hook, esi\\)"
files = ["kernel/fs/diskfs/ext4.c"]

[[gate.assertion]]
pattern = "bcache_set_sync_hook\\(sb->bc, fat32_sync_hook, sb\\)"
files = ["kernel/fs/diskfs/fat32.c"]

# The gate itself, so the contract has a runner that cannot quietly go missing.
# The injection point travels through /proc/a20/journal, not the command line:
# QEMU's LoongArch virt board drops -append, and a gate whose crash selector
# depends on bootargs would pass on four architectures and prove nothing on
# the fifth.  The command-line route still exists for interactive use, so the
# assertion below covers the shared table of legal points instead.
[[gate.assertion]]
pattern = "/proc/a20/journal"
files = ["tools/ext4_journal_gate.py", "kernel/fs/procfs/procfs.c"]

[[gate.assertion]]
pattern = 'jbd2_crash_points'
files = ["kernel/fs/diskfs/ext4_journal.c"]

[[gate.assertion]]
pattern = "ext4_journal_set_crash_point"
files = ["kernel/fs/diskfs/ext4_journal.c", "kernel/include/fs/ext4_journal.h",
         "kernel/fs/procfs/procfs.c"]

[[gate.assertion]]
pattern = "smoke-ext4-journal"
files = ["tools/targets-smoke.mk"]

[[gate.assertion]]
pattern = "build-dir.*BUILD_DIR"
files = ["tools/targets-smoke.mk"]

[[gate.assertion]]
pattern = "EXT4_JOURNAL_IMG"
files = ["Makefile", "tools/targets-smoke.mk"]
