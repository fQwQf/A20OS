# --- gates whose assertions were `bad=$(rg ... | rg -v whitelist)`.
# The verdict depends on the surviving output, not an exit code, so they
# need post_filter rather than plain negation.

[[gate]]
name = "check-blocking-point-boundary"
make_target = "check-blocking-point-boundary"
[[gate.assertion]]
pattern = "BLOCKING_POINT_PROTOCOL_AUDIT"
