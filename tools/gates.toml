[[gate.assertion]]
pattern = "spinlock_t tasklist_lock"
files = ["kernel/proc/proc.c"]

[[gate.assertion]]
pattern = "lock_counters_register\\(&tasklist_lock"
files = ["kernel/proc/proc.c"]

[[gate.assertion]]
pattern = "SCHED_STRESS: lock-split PASS"
files = ["user/cmds/stress/sched_stress.c"]

