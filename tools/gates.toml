negate = true
globs = ["!kernel/arch/**", "!kernel/platform/**", "!kernel/external/**", "!kernel/include/core/arch.h", "!kernel/mm/vdso.c", "!kernel/include/mm/vdso.h", "!kernel/include/mm/vdso_blob.h", "!kernel/mm/fault.c", "!kernel/drvmod/framework.c"]
pattern = "#if(n?def)?[[:space:]]+(CONFIG_|__)(AARCH64|ARM|RISCV|LOONG|X86|PPC)|CONFIG_ARM32|CONFIG_AARCH64|__aarch64__|__arm__"
files = ["kernel"]

[[gate.assertion]]
