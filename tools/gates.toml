[[gate.assertion]]
pattern = "proc_try_wake_locked\\(t, t->wait_seq, PROC_WAKE_EVENT\\)"
files = ["kernel/proc/sched.c"]

[[gate.assertion]]
negate = true
rg_flags = ["--pcre2"]
globs = ["*.[ch]", "!kernel/external/**"]
pattern = "\\bproc_block_until[[:space:]]*\\("
files = ["kernel"]

[[gate.assertion]]
post_filter = "^kernel/proc/(task|park)\\.c:"
rg_flags = ["--pcre2"]
globs = ["*.[ch]", "!kernel/external/**"]
pattern = "(?:->|\\.)state[[:space:]]*=[[:space:]]*PROC_BLOCKED"
