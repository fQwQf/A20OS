# Source-level contract assertions, extracted verbatim from the `rg` recipes
# that used to be inline in tools/targets-gates.mk.  The extraction was
# mechanical (shlex over the real recipes) and checked by reconstructing each
# rg argv back out of this table and diffing it against the original, so the
# gate set is the one that used to run -- not a retyped approximation of it.
#
# This file is now the single source of truth for these 307 pattern checks (and
# 6 non-rg ones: file existence, NOMMU build rejection, doc path resolution and
# the Native ABI cross-table comparison).  Edit it by hand from here on: a
# hand-typed regex is how a gate silently stops asserting what its name claims,
# so prefer a copy-paste of a pattern already verified to match, and add new
# checks with `negate` chosen deliberately.
#
# `negate = true` means the pattern must NOT appear.  `fixed = true` is rg -F.
# A `*` in a path is expanded by the runner, not the shell, so adding a source
# file to a directory is picked up without touching this table.  Patterns are
# stored exactly as rg receives them, i.e. after make collapsed any `$$`.
[[gate]]
name = "vfs-abstraction"
make_target = "check-vfs-abstraction"
[[gate.assertion]]
pattern = "VFS_OPEN_DISPATCH_CONTRACT"
files = ["kernel/include/fs/vfs.h"]

[[gate.assertion]]
pattern = "VFS_REFCOUNT_HELPER_CONTRACT"
files = ["kernel/include/fs/vfs.h"]

[[gate.assertion]]
pattern = "VFS_DCACHE_MOUNT_VNODE_INVARIANT"
files = ["kernel/include/fs/vfs.h"]

[[gate.assertion]]
pattern = "vfile_ref_init"
files = [
    "kernel/fs/file.c",
    "kernel/include/fs/file.h",
    "kernel/include/fs/vfs.h",
]

[[gate.assertion]]
pattern = "vfile_get"
files = [
    "kernel/fs/file.c",
    "kernel/include/fs/file.h",
    "kernel/include/fs/vfs.h",
]

[[gate.assertion]]
pattern = "vfile_put_ref_only"
files = [
    "kernel/fs/file.c",
    "kernel/include/fs/file.h",
    "kernel/include/fs/vfs.h",
]

[[gate.assertion]]
pattern = "\\.open[[:space:]]*="
files = [
    "kernel/fs/diskfs/ramfs.c",
    "kernel/fs/diskfs/fat32.c",
    "kernel/fs/diskfs/ext4.c",
    "kernel/fs/procfs/procfs.c",
    "kernel/fs/devfs/devfs.c",
    "kernel/fs/cgroupfs.c",
    "kernel/fs/sysfs.c",
