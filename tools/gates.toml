[[gate.assertion]]
negate = true
pattern = "refcount_(set|inc|dec_and_test)\\(&[A-Za-z0-9_>\\.-]*->ref_count"
files = [
    "kernel/fs/diskfs/ramfs.c",
    "kernel/fs/diskfs/fat32.c",
    "kernel/fs/diskfs/ext4.c",
    "kernel/fs/procfs/procfs.c",
    "kernel/fs/devfs/devfs.c",
    "kernel/fs/cgroupfs.c",
    "kernel/fs/sysfs.c",
    "kernel/fs/inotify.c",
    "kernel/fs/memfd.c",
    "kernel/fs/pipe.c",
]

[[gate.assertion]]
negate = true
pattern = "for simplicity"
files = ["kernel/fs/cgroupfs.c"]

